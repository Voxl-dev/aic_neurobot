# Fine-tune ACT para AIC Challenge — UR5e + 3 cámaras + estado 32D

defaults:
  - _self_

policy:
  type: act
  pretrained_path: lerobot/act_aloha_sim_insertion_human

  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  replace_final_stride_with_dilation: false
  pre_norm: false
  dim_model: 512
  n_heads: 8
  dim_feedforward: 3200
  feedforward_activation: relu
  n_encoder_layers: 4
  n_decoder_layers: 1

  chunk_size: 20
  n_action_steps: 20

  use_vae: true
  latent_dim: 32
  n_vae_encoder_layers: 4
  kl_weight: 10.0

  input_shapes:
    observation.images.center: [3, 480, 640]
    observation.images.left: [3, 480, 640]
    observation.images.right: [3, 480, 640]
    observation.state: [32]
  output_shapes:
    action: [6]

  input_normalization_modes:
    observation.images.center: mean_std
    observation.images.left: mean_std
    observation.images.right: mean_std
    observation.state: min_max
  output_normalization_modes:
    action: min_max

dataset:
  repo_id: aic_team/sfp_sc_insertion_step4
  root: data/dataset_lerobot_step4
  episodes: null

training:
  offline_steps: 60000
  online_steps: 0
  batch_size: 8
  num_workers: 4
  lr: 1.0e-5
  lr_backbone: 1.0e-5
  weight_decay: 1.0e-4
  grad_clip_norm: 10.0
  save_freq: 5000
  log_freq: 200
  eval_freq: 0
  use_amp: true

optimizer:
  type: adamw
  lr_warmup_steps: 1000

env:
  type: null

hydra:
  run:
    dir: outputs/act_aic_run1
  job:
    name: act_aic_v1
